<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5761300467193594" crossorigin="anonymous"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineOTTBeat | Curated Movies & OTT Discoveries</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f17; color: #f1f5f9; }
    .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <header class="sticky top-0 z-40 bg-[#0b0f17]/90 backdrop-blur-md border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-rose-600 flex items-center justify-center font-black text-xl text-white shadow-lg shadow-rose-950/50">C</div>
        <div>
          <span class="font-extrabold text-xl tracking-tight text-white">Cine<span class="text-rose-500">OTT</span>Beat</span>
          <span class="hidden sm:inline-block text-xs text-slate-400 ml-2 px-2 py-0.5 rounded bg-slate-800/80 border border-slate-700">Curated</span>
        </div>
      </div>
      <div class="relative flex-1 max-w-md">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
        <input id="searchInput" type="text" placeholder="Search movies, overviews..." class="w-full pl-10 pr-4 py-2 bg-slate-900 border border-slate-700/80 rounded-full text-sm text-slate-100 placeholder-slate-400 focus:outline-none focus:border-rose-500 transition-colors">
      </div>
      <button onclick="toggleWatchlistView()" class="relative flex items-center gap-2 px-3.5 py-2 rounded-full bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-semibold text-slate-200 transition">
        <i class="fa-solid fa-bookmark text-rose-400"></i>
        <span class="hidden md:inline">Watchlist</span>
        <span id="watchlistCount" class="px-1.5 py-0.2 rounded-full bg-rose-600 text-[10px] text-white font-bold">0</span>
      </button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
    <div class="flex items-center justify-between mb-6">
      <h2 id="gridTitle" class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-rose-500"></span> Live TMDB Discoveries
      </h2>
      <span id="resultCount" class="text-xs text-slate-400">Loading movies...</span>
    </div>
    <div id="moviesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 md:gap-6"></div>
    <div id="emptyState" class="hidden text-center py-16 space-y-3">
      <i class="fa-solid fa-film text-4xl text-slate-600"></i>
      <h3 class="text-base font-semibold text-slate-300">No titles match your search</h3>
      <p class="text-xs text-slate-500">Try searching for other titles or clear the filters.</p>
    </div>
  </main>

  <div id="movieModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-3xl max-w-xl w-full p-6 md:p-8 relative max-h-[90vh] overflow-y-auto custom-scrollbar">
      <button onclick="closeModal()" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-slate-400 hover:text-white transition">✕</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <footer class="border-t border-slate-800 bg-[#070a10] py-6 text-center text-xs text-slate-500">
    <p>© 2026 CineOTTBeat. Powered by TMDB API.</p>
  </footer>

  <script>
    let movies = [];
    let watchlist = JSON.parse(localStorage.getItem('cine_watchlist') || '[]');

    window.addEventListener('DOMContentLoaded', () => {
      fetchMovies();
      updateWatchlistBadge();
    });

    function fetchMovies() {
      const TMDB_TOKEN = 'eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiI1NTBiN2EyY2JmZjdiOTJhYmJkYzczN2UyMWIzZTliOSIsIm5iZiI6MTc5MzA1MzQ5MC4wMTMsInN1YiI6IjZhZGZkMzMyMjY3M2FhZTQyYzg2NzVhNyIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.t-o4nnbmdmQ5inTyPtCbEzrvI-d1nGXcP5iSIEptlbA';
      const languages = 'ml|hi|ta|kn|te|en';

      fetch(`https://api.themoviedb.org/3/discover/movie?include_adult=false&include_video=false&language=en-US&page=1&sort_by=popularity.desc&with_original_language=${languages}`, {
        method: 'GET',
        headers: {
          'Authorization': 'Bearer ' + TMDB_TOKEN,
          'Content-Type': 'application/json;charset=utf-8'
        }
      })
      .then(res => res.json())
      .then(data => {
        if (!data.results) return;
        movies = data.results.map(m => {
          return {
            id: m.id,
            title: m.title,
            year: m.release_date ? m.release_date.split('-')[0] : 'N/A',
            rating: m.vote_average ? m.vote_average.toFixed(1) : 'NR',
            platform: "Popular Discoveries",
            poster: m.poster_path ? `https://image.tmdb.org/t/p/w500${m.poster_path}` : 'https://images.unsplash.com/photo-1542204165-65ab26472a7b?w=500&auto=format&fit=crop&q=60',
            summary: m.overview || 'No synopsis available.',
            category: m.original_language ? m.original_language.toUpperCase() : 'N/A'
          };
        });
        applyFilters();
      })
      .catch(err => {
        console.error('Fetch error:', err);
        document.getElementById('resultCount').textContent = 'Failed to load movies';
      });
    }

    function renderMovies(items) {
      const grid = document.getElementById('moviesGrid');
      const empty = document.getElementById('emptyState');
      if (!grid) return;
      grid.innerHTML = '';
      if (items.length === 0) {
        empty.classList.remove('hidden');
        document.getElementById('resultCount').textContent = '0 titles';
        return;
      }
      empty.classList.add('hidden');
      document.getElementById('resultCount').textContent = `${items.length} titles`;

      items.forEach(m => {
        const isSaved = watchlist.includes(m.id);
        const card = document.createElement('div');
        card.className = "poster-card group relative bg-slate-900/90 rounded-2xl overflow-hidden border border-slate-800 hover:border-rose-500/50 transition-all duration-300 flex flex-col cursor-pointer";
        card.onclick = () => openModal(m.id);
        card.innerHTML = `
          <div class="relative aspect-[2/3] w-full overflow-hidden bg-slate-950">
            <img src="${m.poster}" alt="${m.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
            <div class="absolute top-2 left-2 px-2 py-0.5 rounded-md bg-black/75 backdrop-blur-md text-[11px] font-bold text-amber-400 flex items-center gap-1">
              <i class="fa-solid fa-star text-[10px]"></i> ${m.rating}
            </div>
            <button onclick="event.stopPropagation(); toggleWatchlist(${m.id})" class="absolute top-2 right-2 w-7 h-7 rounded-full ${isSaved ? 'bg-rose-600 text-white' : 'bg-black/60 text-slate-300 hover:text-white'} backdrop-blur-md flex items-center justify-center text-xs transition">
              <i class="fa-${isSaved ? 'solid' : 'regular'} fa-bookmark"></i>
            </button>
            <div class="absolute bottom-2 left-2 right-2 flex items-center justify-between">
              <span class="px-2 py-0.5 rounded bg-slate-900/90 text-[10px] font-medium text-slate-300 border border-slate-700/60">${m.platform}</span>
              <span class="text-[10px] text-slate-400">${m.year}</span>
            </div>
          </div>
          <div class="p-3 flex-1 flex flex-col justify-between">
            <div>
              <p class="text-[11px] text-rose-400 font-medium uppercase tracking-wider mb-0.5">${m.category}</p>
              <h3 class="font-bold text-sm text-slate-100 group-hover:text-rose-400 transition-colors line-clamp-1">${m.title}</h3>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
      updateWatchlistBadge();
    }

    document.getElementById('searchInput').addEventListener('input', applyFilters);

    function applyFilters() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      let filtered = movies;
      if (q) {
        filtered = filtered.filter(m => 
          m.title.toLowerCase().includes(q) || 
          m.summary.toLowerCase().includes(q)
        );
      }
      renderMovies(filtered);
    }

    function toggleWatchlist(id) {
      if (watchlist.includes(id)) {
        watchlist = watchlist.filter(item => item !== id);
      } else {
        watchlist.push(id);
      }
      localStorage.setItem('cine_watchlist', JSON.stringify(watchlist));
      applyFilters();
    }

    function updateWatchlistBadge() {
      document.getElementById('watchlistCount').textContent = watchlist.length;
    }

    function toggleWatchlistView() {
      const savedMovies = movies.filter(m => watchlist.includes(m.id));
      document.getElementById('gridTitle').innerHTML = '<span class="w-2 h-2 rounded-full bg-rose-500"></span> Saved In Your Watchlist';
      renderMovies(savedMovies);
    }

    function openModal(id) {
      const m = movies.find(item => item.id === id);
      if (!m) return;
      const isSaved = watchlist.includes(m.id);
      const modalContent = document.getElementById('modalContent');
      modalContent.innerHTML = `
        <div class="space-y-4">
          <div class="flex items-center gap-2">
            <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-rose-500/20 text-rose-400 border border-rose-500/30">${m.category}</span>
            <span class="text-xs text-slate-400">${m.year}</span>
            <span class="text-xs text-amber-400 font-bold">★ ${m.rating} TMDB</span>
          </div>
          <h2 class="text-2xl font-black text-white">${m.title}</h2>
          <p class="text-sm text-slate-300 leading-relaxed">${m.summary}</p>
          <div class="p-4 rounded-2xl bg-slate-950 border border-slate-800 flex items-center justify-between">
            <div>
              <p class="text-xs text-slate-400">Source</p>
              <p class="text-sm font-bold text-white">${m.platform}</p>
            </div>
            <button onclick="toggleWatchlist(${m.id}); openModal(${m.id});" class="px-4 py-2 rounded-xl text-xs font-semibold ${isSaved ? 'bg-rose-600 text-white' : 'bg-slate-800 text-slate-200 hover:bg-slate-700'} border border-slate-700 transition">
              <i class="fa-${isSaved ? 'solid' : 'regular'} fa-bookmark mr-1"></i> ${isSaved ? 'In Watchlist' : 'Add to Watchlist'}
            </button>
          </div>
        </div>
      `;
      const modal = document.getElementById('movieModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeModal() {
      const modal = document.getElementById('movieModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }
  </script>
</body>
</html>
